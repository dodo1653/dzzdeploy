<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · dzz</title>
<link rel="icon" href="/assets/icon.png">
<meta name="description" content="Sign in to dzz with Google, Discord, X or a Solana wallet. Your launches and creator fees from every wallet, in one place.">
<script>
// already signed in (and not just back from a provider with an error): straight to the dashboard
;(() => { let t = null; try { t = localStorage.getItem('dzz.profile') } catch {}; if (t && !/dzz_(token|error)=/.test(location.hash)) location.replace(new URLSearchParams(location.search).get('next') || '/app') })()
</script>
<script src="/assets/theme.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/ui.css">
<style>
body { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; }
.top { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding: 22px 28px; }
.top a.back { display: inline-flex; align-items: center; gap: 8px; color: var(--t2); text-decoration: none; font-size: 13.5px; transition: color .2s; } .top a.back:hover { color: var(--ink); }
.top a.back .ic { transform: scaleX(-1); width: 15px; height: 15px; }
.center { position: relative; z-index: 2; display: grid; place-items: center; padding: 24px 16px 70px; }
.stack { width: min(340px, 100%); text-align: center; }
.logo { display: inline-flex; margin: 0 auto 26px; } .logo b { font-size: 38px; }
h1 { margin: 0; font: 500 clamp(30px, 3.4vw, 36px)/1.1 var(--ui); letter-spacing: -.045em; }
.sub { margin: 12px 0 34px; color: var(--t2); font-size: 15px; }
.opts { display: grid; gap: 10px; }
.opt { height: 44px; border-radius: 9px; border: 1px solid var(--line2); background: color-mix(in srgb, var(--bg) 70%, #1a1b1f); color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 11px;
  font: 500 14px var(--ui); cursor: pointer; transition: background .2s, border-color .2s, transform .12s; }
.opt:hover { border-color: rgba(255,255,255,.22); background: color-mix(in srgb, var(--bg) 55%, #24252b); } .opt:active { transform: translateY(1px); }
.opt .ic { width: 18px; height: 18px; }
.opt[data-p="google"] span { color: #e9ecf3; } .opt[data-p="discord"] span { color: #b4baff; } .opt[data-p="x"] span { color: #e9ecf3; }
.opt:disabled { cursor: default; opacity: .5; } .opt:disabled:hover { border-color: var(--line2); background: color-mix(in srgb, var(--bg) 70%, #1a1b1f); }
.opt em { font: 400 11px var(--mono); font-style: normal; color: var(--t3); margin-left: 2px; }
.or { display: flex; align-items: center; gap: 12px; margin: 18px 0; color: var(--t3); font: 400 12px var(--mono); }
.or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.wal span { color: var(--ink); }
.msg { min-height: 20px; margin: 18px 0 0; font-size: 13px; color: var(--t2); }
.msg.err { color: var(--bad); }
.more { margin-top: 26px; font-size: 13px; color: var(--t3); }
.more a { color: var(--t2); text-decoration: none; } .more a:hover { color: var(--ink); }
.fine { position: relative; z-index: 2; border-top: 1px solid var(--line); text-align: center; padding: 20px 16px; font-size: 12.5px; color: var(--t3); }
.fine b { color: var(--t2); font-weight: 500; }
.in-1 { animation: rise .8s var(--ease) both; } .in-2 { animation: rise .8s var(--ease) .08s both; } .in-3 { animation: rise .8s var(--ease) .16s both; } .in-4 { animation: rise .8s var(--ease) .24s both; }
</style>
</head>
<body data-hud>
<header class="top">
  <a class="back" href="/about"><svg class="ic"><use href="/assets/icons.svg#arrow"/></svg>About dzz</a>
  <span></span>
</header>

<div class="center">
  <div class="stack">
    <a class="mark logo in-1" href="/about"><b>dz<i>z</i></b></a>
    <h1 class="in-2">Sign in to <span class="grad">dzz</span></h1>
    <p class="sub in-2">Launch at the address you choose.</p>
    <div class="opts in-3">
      <button class="opt" data-p="google"><svg class="ic brand"><use href="/assets/icons.svg#google"/></svg><span>Continue with Google</span><em></em></button>
      <button class="opt" data-p="discord"><svg class="ic brand"><use href="/assets/icons.svg#discord"/></svg><span>Continue with Discord</span><em></em></button>
      <button class="opt" data-p="x"><svg class="ic brand"><use href="/assets/icons.svg#x"/></svg><span>Continue with X</span><em></em></button>
    </div>
    <div class="or in-4">or</div>
    <button class="opt wal in-4" id="wallet" style="width:100%"><svg class="ic"><use href="/assets/icons.svg#wallet"/></svg><span>Continue with a Solana wallet</span></button>
    <p class="msg" id="msg" role="status"></p>
    <p class="more in-4"><a href="/about">What is dzz?</a></p>
  </div>
</div>

<div class="fine">Every wallet and account you sign in with joins <b>one dzz account</b>. Independent tool, not affiliated with pump.fun or Meteora. <a href="/privacy" style="color:inherit">Privacy</a> · <a href="/terms" style="color:inherit">Terms</a></div>

<script src="/assets/bg.js"></script>
<script src="/assets/account.js"></script>
<script>
const $ = (id) => document.getElementById(id)
const say = (t, err) => { $('msg').textContent = t || ''; $('msg').className = 'msg' + (err ? ' err' : '') }
const NAMES = { google: 'Google', discord: 'Discord', x: 'X' }
const next = new URLSearchParams(location.search).get('next') || '/app'
const go = () => location.replace(next)
;(async () => {
  if (DzzAuth.lastError) say(DzzAuth.lastError, true)
  else if (DzzAuth.token()) return go()                 // back from Google / Discord / X, signed in
  const on = await DzzAuth.providers()
  document.querySelectorAll('.opt[data-p]').forEach((b) => { if (!on[b.dataset.p]) { b.disabled = true; b.querySelector('em').textContent = 'soon' } })
})()
document.querySelectorAll('.opt[data-p]').forEach((b) => (b.onclick = () => { say(`Going to ${NAMES[b.dataset.p]}…`); DzzAuth.oauth(b.dataset.p, { back: location.origin + '/login' + location.search }) }))
$('wallet').onclick = async () => {
  try { $('wallet').disabled = true; say('Sign the message in your wallet. It is not a transaction and costs nothing.'); await DzzAuth.signInWallet(); say('Signed in. Opening your dashboard…'); go() }
  catch (e) { say(e.message, true) } finally { $('wallet').disabled = false }
}
</script>
</body>
</html>
